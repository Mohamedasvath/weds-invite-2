<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-[env(safe-area-inset-top,0px)]">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Nikah Invitation – Abib Rahuman & Jesima Parveen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Noto+Serif+Tamil:wght@400;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind (Play CDN, pinned) -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        silk: '#efe6da', ivory: '#f8f1e6', cream: '#f1e4d1',
                        maroon: '#7b2d2a', rose: '#b7646b', gold: '#b48a3c',
                        'gold-lt': '#e6cb83', ink: '#4b3a35'
                    },
                    fontFamily: {
                        ta: ['"Noto Serif Tamil"', '"Latin Modern Roman"', 'Georgia', 'serif'],
                        en: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        latin: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        script: ['"Great Vibes"', '"Noto Serif Tamil"', '"Snell Roundhand"', 'cursive'],
                        arabic: ['Amiri', '"Traditional Arabic"', 'serif']
                    },
                    keyframes: {
                        sway: {
                            from: { transform: 'rotate(calc(var(--r,0deg) - 3deg)) translateY(0)' },
                            to: { transform: 'rotate(calc(var(--r,0deg) + 3deg)) translateY(6px)' }
                        },
                        draw: { to: { strokeDashoffset: '0' } },
                        fadein: { from: { opacity: '0' }, to: { opacity: '.8' } },
                        monoIn: { to: { transform: 'none', opacity: '1' } },
                        drip: {
                            '0%': { transform: 'scaleY(0)', transformOrigin: 'top' },
                            '50%': { transform: 'scaleY(1)', transformOrigin: 'top' },
                            '51%': { transformOrigin: 'bottom' },
                            '100%': { transform: 'scaleY(0)', transformOrigin: 'bottom' }
                        },
                        shine: {
                            from: { backgroundPosition: '120% 0' },
                            to: { backgroundPosition: '-120% 0' }
                        },
                        rise: { to: { opacity: '1', transform: 'none', filter: 'none' } },
                        fall: {
                            '0%': { transform: 'translate3d(0,-5vh,0) rotate(0)' },
                            '50%': { transform: 'translate3d(var(--x),55vh,0) rotate(200deg)' },
                            '100%': { transform: 'translate3d(calc(var(--x) * -.5),110vh,0) rotate(420deg)' }
                        },
                        nameGlow: {
                            '0%,100%': { color: '#7b2d2a' },
                            '50%': { color: '#c0646a' }
                        },
                        twinkle: {
                            '0%,100%': { opacity: '.15', transform: 'scale(.5) rotate(0deg)' },
                            '50%': { opacity: '1', transform: 'scale(1.1) rotate(45deg)' }
                        }
                    },
                    animation: {
                        sway: 'sway var(--d,9s) ease-in-out infinite alternate',
                        draw1: 'draw 2.4s .2s ease forwards',
                        draw2: 'draw 2.4s .6s ease forwards',
                        fadein: 'fadein 2s 1.6s both',
                        monoIn: 'monoIn 1.4s 1.1s cubic-bezier(.2,.8,.2,1) forwards',
                        drip: 'drip 2s infinite',
                        shine: 'shine 6s linear infinite',
                        riseW: 'rise .9s cubic-bezier(.2,.7,.2,1) forwards',
                        riseC: 'rise .8s cubic-bezier(.2,.7,.2,1) forwards',
                        fall: 'fall var(--t) linear infinite',
                        twinkle: 'twinkle var(--d,3s) ease-in-out infinite',
                        nameGlow: 'nameGlow 6s ease-in-out infinite'
                    }
                }
            }
        }
    </script>
</head>

<body

    </svg>

    <!-- Language switch -->

    <main id="top"

                    <path pathLength="1" d="M48 560 V242 C48 180 112 154 150 74 C188 154 252 180 252 242 V560"
                        class="fill-none [stroke:url(#goldg)] [stroke-linecap:round] [stroke-dasharray:.012_.012] [stroke-dashoffset:0] [stroke-width:.8] opacity-0 animate-fadein motion-reduce:animate-none motion-reduce:opacity-80" />
                </svg>
            </div>

            <div class="relative z-[2] w-full max-w-[min(74%,300px)]">
                <p data-i18n="celebrating" data-split="chars" data-base="600"
                    class="font-script text-[1.75rem] text-gold mb-1.5 leading-[1.2]"></p>
                <div data-depth=".08"
                    class="flex justify-center items-center h-[150px] mt-1.5 mb-0.5 max-[380px]:h-[125px] [transform:translate3d(var(--px,0px),var(--py,0px),0)]"
                    aria-hidden="true">
                    <span
                        class="font-latin font-semibold text-[7.4rem] max-[380px]:text-[6rem] leading-none text-maroon -translate-x-[60px] opacity-0 animate-monoIn motion-reduce:animate-none motion-reduce:translate-x-0 motion-reduce:opacity-100">A</span>
                    <span

                el.classList.remove('opacity-0', 'translate-y-3.5', 'scale-[.86]');
            }

            /* ================= apply language ================= */
            function applyLang(l) {
                lang = l;
                var d = T[l];
                root.lang = l === 'ta' ? 'ta' : 'en';
                root.style.fontSize = l === 'en' ? '17.5px' : '16px';
                body.classList.remove('font-ta', 'font-en');
                body.classList.add(l === 'en' ? 'font-en' : 'font-ta');
                document.title = d.docTitle;
                document.querySelectorAll('[data-i18n]').forEach(function (el) {
                    var k = el.getAttribute('data-i18n');
                    if (!(k in d)) return;
                    if (el.hasAttribute('data-split')) {
                        build(el, d[k]);
                        if (el.getAttribute('data-in')) revealSplit(el);
                    } else {
                        el.innerHTML = d[k];
                    }
                });
                document.querySelectorAll('[data-lang]').forEach(function (b) {
                    var on = b.getAttribute('data-lang') === l;
                    b.setAttribute('aria-pressed', on);
                    b.classList.toggle('bg-maroon', on);
                    b.classList.toggle('text-ivory', on);
                    b.classList.toggle('text-maroon', !on);
                });
                if (done) renderDone();
                try { localStorage.setItem('nikah-lang', l); } catch (e) { }
            }
            document.querySelectorAll('[data-lang]').forEach(function (b) {
                b.addEventListener('click', function () { applyLang(b.getAttribute('data-lang')); });
            });
            var saved = null;
            try { saved = localStorage.getItem('nikah-lang'); } catch (e) { }
            applyLang(saved === 'ta' ? 'ta' : 'en');

            /* ================= scroll reveal ================= */
            var targets = document.querySelectorAll('[data-split],[data-fade],[data-grow]');
            if (reduce || !('IntersectionObserver' in window)) {
                targets.forEach(show);
            } else {
                var io = new IntersectionObserver(function (entries) {
                    entries.forEach(function (e) { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } });
                }, { threshold: .25 });
                targets.forEach(function (el) { io.observe(el); });
            }

            /* ================= countdown (25 Oct 2026, 10:00 IST) ================= */
            var target = new Date('2026-10-25T10:00:00+05:30').getTime();
            var box = document.getElementById('count');
            var cells = {};
            box.querySelectorAll('[data-u]').forEach(function (b) { cells[b.getAttribute('data-u')] = b; });
            function pad(n) { return n < 10 ? '0' + n : '' + n; }
            function renderDone() {
                box.innerHTML = '<p class="col-span-4 m-0 text-maroon font-semibold">' + T[lang].done + '</p>';
            }
            function tick() {
                var diff = target - Date.now();
                if (diff <= 0) { done = true; renderDone(); return false; }
                var s = Math.floor(diff / 1000);
                cells.d.textContent = pad(Math.floor(s / 86400));
                cells.h.textContent = pad(Math.floor(s % 86400 / 3600));
                cells.m.textContent = pad(Math.floor(s % 3600 / 60));
                cells.s.textContent = pad(s % 60);
                return true;
            }
            if (tick()) { var t = setInterval(function () { if (!tick()) clearInterval(t); }, 1000); }

                s7: [
                    ['rose', 140, 15, 'top:-24px;right:-40px', .12, 9],

                ],
                s6: [
                    ['rose', 140, -15, 'top:-24px;left:-40px', .12, 9],
                    ['rose', 150, 165, 'bottom:-34px;right:-40px', .14, 11],
                    ['rose', 100, 30, 'top:-14px;right:-26px', -.1, 12, .9],

                    ['sprig', 140, -10, 'top:22%;right:-44px', .1, 10, .8, 1],
                    ['jasmine', 60, 15, 'top:40%;left:6px', -.18, 9],
                    ['bud', 74, -40, 'bottom:30%;right:-18px', .2, 11],
                    ['leaf', 70, 30, 'top:100px;left:70px', -.12, 10, .9],
                    ['spark', 16, 0, 'top:12%;left:36%', -.3, 3],
                    ['spark', 14, 0, 'top:50%;right:14%', .3, 4],
                    ['spark', 12, 0, 'bottom:22%;left:16%', -.25, 5]
                ]
            };
            Object.keys(F).forEach(function (id) {
                var sec = document.getElementById(id);
                F[id].forEach(function (f) {
                    var w = document.createElement('span');
                    w.className = 'absolute z-[1] pointer-events-none will-change-transform [transform:translate3d(var(--px,0px),var(--py,0px),0)]';
                    w.setAttribute('data-depth', f[4]);
                    w.setAttribute('aria-hidden', 'true');
                    w.style.cssText = 'width:' + f[1] + 'px;height:' + f[1] + 'px;' + f[3];
                    var inner = document.createElement('span');
                    inner.className = 'block w-full h-full motion-reduce:animate-none ' + (f[0] === 'spark' ? 'animate-twinkle' : 'animate-sway');
                    inner.style.cssText = '--r:' + f[2] + 'deg;--d:' + f[5] + 's;opacity:' + (f[6] || .95);
                    inner.innerHTML = '<svg class="w-full h-full overflow-visible' + (f[7] ? ' scale-x-[-1]' : '') + '"><use href="#' + f[0] + '"/></svg>';
                    w.appendChild(inner);
                    sec.appendChild(w);
                });
            });

            /* ================= parallax (scroll + pointer + tilt) ================= */
            if (!reduce) {
                var layers = [].slice.call(document.querySelectorAll('[data-depth]'));
                var mx = 0, my = 0, queued = false;
                function frame() {
                    queued = false;
                    var vh = window.innerHeight;
                    layers.forEach(function (el) {
                        var sec = el._sec || (el._sec = el.closest('section'));
                        var r = sec.getBoundingClientRect();
                        if (r.bottom < -250 || r.top > vh + 250) return;
                        var d = parseFloat(el.getAttribute('data-depth'));
                        var off = (r.top + r.height / 2) - vh / 2;
                        el.style.setProperty('--py', (off * d + my * d * 90).toFixed(1) + 'px');
                        el.style.setProperty('--px', (mx * d * 150).toFixed(1) + 'px');
                    });
                }
                function queue() { if (!queued) { queued = true; requestAnimationFrame(frame); } }
                window.addEventListener('scroll', queue, { passive: true });
                window.addEventListener('resize', queue);
                window.addEventListener('pointermove', function (e) {
                    if (e.pointerType === 'touch') return;
                    mx = e.clientX / window.innerWidth - .5;
                    my = e.clientY / window.innerHeight - .5;
                    queue();
                }, { passive: true });
                window.addEventListener('deviceorientation', function (e) {
                    if (e.gamma == null) return;
                    mx = Math.max(-.5, Math.min(.5, e.gamma / 40));
                    my = Math.max(-.5, Math.min(.5, ((e.beta || 45) - 45) / 60));
                    queue();
                }, { passive: true });
                queue();
            }

            /* ================= falling petals ================= */
            if (!reduce) {
                var wrap = document.getElementById('petals');
                var n = window.innerWidth < 640 ? 12 : 20;
                for (var k = 0; k < n; k++) {
                    var p = document.createElement('i');
                    var w = 8 + Math.random() * 10;
                    var pale = Math.random() < .3;
                    p.className = 'absolute -top-[30px] rounded-[70%_0_70%_0] opacity-65 animate-fall ' +
                        (pale ? 'bg-[linear-gradient(135deg,#fffaf2,#e6cb83)]' : 'bg-[linear-gradient(135deg,#e6a9ad,#b7646b)]');
                    p.style.left = (Math.random() * 100) + '%';
                    p.style.width = w + 'px';
                    p.style.height = (w * 1.25) + 'px';
                    p.style.setProperty('--t', (12 + Math.random() * 12) + 's');
                    p.style.setProperty('--x', ((Math.random() - .5) * 160) + 'px');
                    p.style.animationDelay = (-Math.random() * 20) + 's';
                    wrap.appendChild(p);
                }
            }
        })();
